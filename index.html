<!DOCTYPE html>
<html lang="ms">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perpustakaan Digital</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;

    background: #071a33;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}


/* KOTAK LOGIN */

.login-box {
    width: 100%;
    max-width: 400px;

    background: white;

    padding: 45px 35px;

    border-radius: 18px;

    text-align: center;

    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}


/* LOGO */

.logo {
    width: 65px;
    height: 65px;

    margin: 0 auto 20px;

    background: #071a33;

    border-radius: 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;
}


/* TAJUK */

h1 {
    color: #111827;

    font-size: 25px;

    margin-bottom: 10px;
}

.subtitle {
    color: #6b7280;

    font-size: 14px;

    line-height: 1.6;

    margin-bottom: 30px;
}


/* LABEL */

label {
    display: block;

    text-align: left;

    color: #374151;

    font-size: 13px;

    font-weight: 600;

    margin-bottom: 8px;
}


/* PASSWORD */

input {
    width: 100%;

    padding: 13px 15px;

    border: 1px solid #d1d5db;

    border-radius: 9px;

    font-size: 14px;

    outline: none;

    transition: 0.2s;
}

input:focus {
    border-color: #071a33;

    box-shadow: 0 0 0 3px rgba(7,26,51,0.1);
}


/* BUTTON */

button {
    width: 100%;

    margin-top: 18px;

    padding: 13px;

    border: none;

    border-radius: 9px;

    background: #071a33;

    color: white;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    background: #102d52;

    transform: translateY(-1px);
}


/* ERROR */

#error {
    display: none;

    color: #dc2626;

    font-size: 13px;

    margin-top: 15px;
}


/* FOOTER */

.footer {
    margin-top: 25px;

    color: #9ca3af;

    font-size: 11px;
}


/* MOBILE */

@media (max-width: 480px) {

    .login-box {
        padding: 35px 25px;
    }

    h1 {
        font-size: 23px;
    }

}

</style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        📚
    </div>


    <h1>
        Perpustakaan Digital
    </h1>


    <p class="subtitle">
        Masukkan kata laluan untuk mengakses
        koleksi e-book digital kami.
    </p>


    <form onsubmit="checkPassword(event)">

        <label for="password">
            Kata Laluan
        </label>


        <input
            type="password"
            id="password"
            placeholder="Masukkan kata laluan"
            autocomplete="off"
            required
        >


        <button type="submit">
            Masuk
        </button>


    </form>


    <p id="error">
        Kata laluan tidak betul. Sila cuba lagi.
    </p>


    <div class="footer">
        © 2026 Perpustakaan Digital
    </div>


</div>


<script>

function checkPassword(event) {

    event.preventDefault();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");


    if (password === "MadDigital2026") {

        window.location.href = "ebook.html";

    } else {

        error.style.display = "block";

        document.getElementById("password").value = "";

    }

}

</script>


</body>
</html>
