<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MadDigital Hub</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;

    background: linear-gradient(
        135deg,
        #29458d 0%,
        #1d3475 45%,
        #0d1838 100%
    );

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;
}

/* KAD UTAMA */
.login-card {
    width: 100%;
    max-width: 520px;

    background: #ffffff;

    border-radius: 28px;

    padding: 50px 45px 40px;

    text-align: center;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.28);
}

/* LOGO */
.logo {
    width: 105px;
    height: 105px;

    margin: 0 auto 35px;

    object-fit: contain;
}

/* TAJUK */
h1 {
    color: #111827;

    font-size: 46px;
    font-weight: 700;

    margin-bottom: 22px;
}

/* PENERANGAN */
.description {
    color: #6b7280;

    font-size: 22px;
    line-height: 1.55;

    margin-bottom: 45px;
}

/* PASSWORD */
.password-input {
    width: 100%;

    height: 95px;

    padding: 0 28px;

    border: 2px solid #dddddd;

    border-radius: 22px;

    font-size: 21px;

    color: #222;

    outline: none;

    margin-bottom: 28px;
}

.password-input::placeholder {
    color: #b7b7b7;
}

.password-input:focus {
    border-color: #2d66e8;
}

/* BUTANG */
.login-button {
    width: 100%;

    height: 95px;

    border: none;

    border-radius: 22px;

    background: #2d66e8;

    color: white;

    font-size: 27px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.login-button:hover {
    background: #2458cc;
}

.login-button:active {
    transform: scale(0.99);
}

/* ERROR */
#error {
    display: none;

    color: #dc2626;

    font-size: 15px;

    margin-top: 18px;
}

/* FOOTER */
.footer {
    margin-top: 38px;

    color: #a7adb8;

    font-size: 18px;
}


/* TELEFON */
@media (max-width: 600px) {

    body {
        padding: 25px;
    }

    .login-card {
        padding: 45px 28px 35px;

        border-radius: 25px;
    }

    .logo {
    width: 150px;
    height: 90px;
    object-fit: contain;
    display: block;
    margin: 0 auto 30px;
}

    h1 {
        font-size: 34px;

        margin-bottom: 18px;
    }

    .description {
        font-size: 18px;

        line-height: 1.55;

        margin-bottom: 35px;
    }

    .password-input {
        height: 65px;
        padding: 0 22px;
        font-size: 17px;
        border-radius: 16px;
    }

    .login-button {
        height: 65px;

        font-size: 20px;

        border-radius: 16px;
    }

    .footer {
        font-size: 15px;

        margin-top: 30px;
    }
}
</style>
</head>

<body>

<div class="login-card">

    <!-- LOGO -->
    <img
        src="Blue and Black Minimalist Brand Logo.png"
        alt="MadDigital Hub"
        class="logo"
    >

    <!-- TAJUK -->
    <h1>
        MadDigital Hub
    </h1>

    <!-- PENERANGAN -->
    <p class="description">
        Akses eksklusif kepada koleksi e-book
        premium untuk belajar, jana pendapatan
        dan bina jenama digital anda
    </p>

    <!-- PASSWORD -->
    <input
        type="password"
        id="password"
        class="password-input"
        placeholder="Masukkan kata laluan"
        autocomplete="off"
    >

    <!-- BUTANG -->
    <button
        class="login-button"
        onclick="checkPassword()"
    >
        MASUK
    </button>

    <!-- ERROR -->
    <p id="error">
        Kata laluan tidak betul.
    </p>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 MadDigital Hub
    </div>

</div>


<script>

function checkPassword() {

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");

    if (password === "MDM@2026!Secure#X9") {

        window.location.href = "ebook.html";

    } else {

        error.style.display = "block";

        document.getElementById("password").value = "";

    }
}

</script>

</body>
</html>
